<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form pemesanan</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f7f7f7;
      color: #222;
    }

    /* Navigasi */
    nav {
      max-width: 700px;
      margin: 0 auto 30px;
      background: #fff;
      border: 1px solid #bbb;
      border-radius: 8px;
      box-shadow: 0 2px 4px rgba(0, 0, 0, .1);
      display: flex;
      justify-content: space-around;
      padding: 10px;
    }
    nav a { color: #1f4e8c; text-decoration: none; font-weight: bold; }
    nav a:hover { text-decoration: underline; }

    /* Layout utama: gambar kiri, form kanan */
    .container {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
    }
    .gambar img {
      width: 180px;
      height: 150px;
      background: #e3e3e3;
      border: 1px solid #bbb;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
    }
    .detail { flex: 1; min-width: 280px; }

    .baris {
      display: flex;
      margin-bottom: 12px;
      align-items: center;
    }
    .baris label {
      width: 150px;
      color: #666;
    }
    .baris input[type="text"] {
      flex: 1;
      padding: 7px 10px;
      background: #fff;
      border: 1px solid #aaa;
      border-radius: 6px;
    }
    .baris input:focus {
      outline: 2px solid #1f4e8c;
    }
    .checkbox { margin-left: 150px; margin-bottom: 8px; color: #1f4e8c; }

    button {
      display: block;
      margin: 25px auto 0;
      padding: 11px 28px;
      background: #1f4e8c;
      color: #fff;
      border: none;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #163a69; }

    #pesan { text-align: center; margin-top: 14px; font-weight: bold; }
    #pesan.ok { color: #1b8a1b; }
    #pesan.err { color: #b22222; }
  </style>
</head>
<body>

  <nav>
    <a href="#">Home</a>
    <a href="#">Register</a>
    <a href="#">Policy</a>
    <a href="#">About</a>
  </nav>

  <div class="container">
    <div class="container">
  <div>
    <div class="gambar" id="kotakFoto">
      <img id="previewFoto" alt="Foto produk" style="display:none">
      <span id="teksFoto">[ Gambar ]</span>
    </div>
    <input type="file" id="inputFoto" accept="image/*" style="margin-top:10px; width:180px">
  </div>

  <form class="detail" id="formBayar">

    <form class="detail" id="formBayar">

      <!-- Detail produk: semua bisa diketik -->
      <div class="baris">
        <label for="judul">Title Here</label>
        <input type="text" id="judul" value="MacBook Air £800">
      </div>

      <div class="baris">
        <label for="tahun">Description : Year</label>
        <input type="text" id="tahun" value="2009">
      </div>

      <div class="baris">
        <label for="model">Model</label>
        <input type="text" id="model" placeholder="Contoh: A1237">
      </div>

      <div class="baris">
        <label for="kondisi">Condition</label>
        <input type="text" id="kondisi" list="daftarKondisi" value="Mint">
        <datalist id="daftarKondisi">
          <option value="Mint">
          <option value="Good">
          <option value="Fair">
        </datalist>
      </div>

      <div class="baris">
        <label for="total">Total Amount</label>
        <input type="text" id="total" value="£800">
      </div>

      <div class="baris">
        <label for="bayarKe">Pay to</label>
        <input type="text" id="bayarKe" value="123-456-789-0">
      </div>

      <!-- Detail pembayaran -->
      <div class="baris">
        <label for="tipe">Payment Type</label>
        <input type="text" id="tipe" list="daftarTipe" placeholder="Ketik atau pilih, mis. Visa Debit">
        <datalist id="daftarTipe">
          <option value="Visa Debit">
          <option value="Mastercard">
          <option value="PayPal">
        </datalist>
      </div>

      <div class="baris">
        <label for="pemilik">Account Holder</label>
        <input type="text" id="pemilik" placeholder="Name Here">
      </div>

      <div class="baris">
        <label for="noakun">Account No</label>
        <input type="text" id="noakun" placeholder="123-456-789-0">
      </div>

      <div class="checkbox">
        <label><input type="checkbox" id="cekHp" checked> Send to Mobile Phone</label>
      </div>
      <div class="checkbox">
        <label><input type="checkbox" id="cekEmail" checked> Email me copy of transaction</label>
      </div>

      <div class="baris">
        <label for="hp">Send to Mobile Phone</label>
        <input type="text" id="hp" value="1234567890, 1234567891">
      </div>

      <div class="baris">
        <label for="email">Send to Email</label>
        <input type="text" id="email" value="mfmm2g13@soton.co.uk, fys_06@yahoo.com">
      </div>

      <button type="submit">Pay using QuidLink</button>
      <div id="pesan"></div>
    </form>
  </div>

  <script>
    document.getElementById('formBayar').addEventListener('submit', function (e) {
      e.preventDefault();
      const pesan = document.getElementById('pesan');

      const judul = document.getElementById('judul').value.trim();
      const total = document.getElementById('total').value.trim();
      const bayarKe = document.getElementById('bayarKe').value.trim();
      const tipe = document.getElementById('tipe').value.trim();
      const pemilik = document.getElementById('pemilik').value.trim();

      if (!judul || !total || !bayarKe || !tipe || !pemilik) {
        pesan.className = 'err';
        pesan.textContent = 'Title, Total Amount, Pay to, Payment Type, dan Account Holder harus diisi.';
        return;
      }
      pesan.className = 'ok';
      pesan.textContent = 'Pembayaran ' + total + ' untuk "' + judul + '" (' + tipe + ') oleh ' + pemilik + ' berhasil diproses.';
    });
  </script>
</body>
</html>
